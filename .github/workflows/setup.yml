name: Setup & Install

on:
  workflow_dispatch:
    inputs:
      run_composer_install:
        description: 'Run composer install'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_yarn_install:
        description: 'Run yarn install'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  setup:
    name: Setup InvoicePlane
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP with Composer
        if: inputs.run_composer_install == 'true'
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.2'
          composer-flags: '--prefer-dist --no-interaction --no-progress'

      - name: Set up Node.js
        if: inputs.run_yarn_install == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install JS dependencies
        if: inputs.run_yarn_install == 'true'
        run: yarn install --frozen-lockfile

      - name: Verify ipconfig.php example
        run: |
          if [ -f ipconfig.php.example ]; then
            echo "ipconfig.php.example present"
          else
            echo "::error::ipconfig.php.example is missing"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Setup Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          [ "${{ inputs.run_composer_install }}" == "true" ] && echo "| Composer install | done |" >> $GITHUB_STEP_SUMMARY || true
          [ "${{ inputs.run_yarn_install }}" == "true" ] && echo "| Yarn install | done |" >> $GITHUB_STEP_SUMMARY || true
