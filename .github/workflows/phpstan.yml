name: PHPStan

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  phpstan:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP with Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.4'
          composer-flags: '--prefer-dist --no-interaction --no-progress'

      - name: Run PHPStan
        id: phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=json > phpstan.json
        continue-on-error: true

      - name: Format results
        id: format
        run: php .github/scripts/parse-phpstan-results.php phpstan.json > phpstan-report.md

      - name: Print report
        if: always()
        run: cat phpstan-report.md

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phpstan-results
          path: |
            phpstan.json
            phpstan-report.md

      - name: Fail if errors found
        if: steps.phpstan.outcome == 'failure'
        run: |
          echo "PHPStan found errors. See phpstan-report.md above."
          exit 1
